<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #d0e8f2;
      font-family: sans-serif;
    }

    h1 {
      color: #1a4a6e;
      font-size: 5rem;
      margin: 0 0 8px;
    }

    p {
      color: #1a4a6e;
      font-size: 1.2rem;
      margin: 0 0 24px;
    }

    a {
      color: #1a4a6e;
      font-weight: bold;
      text-decoration: none;
      border: 2px solid #5a9abf;
      padding: 10px 24px;
      border-radius: 8px;
      background: #a8d0e8;
      transition: background 0.15s;
    }

    a:hover {
      background: #8bbfd8;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Page not found</p>
  <a href="/">Go home</a>
</body>
</html>
